                  release: ${{ parameters.dockerhub_release }}

          - job: fedora_43_arm64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-sanity-test-containers.yml@self
                parameters:
                  name: fedora-43
                  arch: arm64
                  qemu: 'true'
                  release: ${{ parameters.dockerhub_release }}

          # openSUSE: amd64, arm64
          - job: opensuse_amd64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-sanity-test-containers.yml@self
                parameters:
                  name: opensuse
                  arch: amd64
                  release: ${{ parameters.dockerhub_release }}

          - job: opensuse_arm64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-sanity-test-containers.yml@self
                parameters:
                  name: opensuse
