name: $(Date:yyyyMMdd).$(Rev:r)

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool: 1es-windows-2022-x64
    stages:
      - stage: Snapcraft
        dependsOn: []
        jobs:
          - job: snapcraft_x64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-containers.yml@self
                parameters:
                  arch: snapcraft-x64
                  release: false

          - job: snapcraft_arm64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-containers.yml@self
                parameters:
                  qemu: 'true'
                  arch: snapcraft-arm64
                  release: false
