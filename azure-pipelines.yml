                  release: ${{ parameters.dockerhub_release }}

          # Red Hat: amd64, arm64
          - job: redhat_amd64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-sanity-test-containers.yml@self
                parameters:
                  name: redhat
                  arch: amd64
                  release: ${{ parameters.dockerhub_release }}

          - job: redhat_arm64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-sanity-test-containers.yml@self
                parameters:
                  name: redhat
                  arch: arm64
                  qemu: 'true'
                  release: ${{ parameters.dockerhub_release }}

          # Ubuntu 22.04: amd64, arm, arm64
          - job: ubuntu_22_amd64
            pool:
              name: 1es-ubuntu-22.04-x64
              os: linux
            steps:
              - template: build-sanity-test-containers.yml@self
                parameters:
                  name: ubuntu-22
                  arch: amd64
                  release: ${{ parameters.dockerhub_release }}

          - job: ubuntu_22_arm
