parameters:
  - name: config
    type: string
  - name: arch
    type: string
  - name: tuple
    type: string
  - name: pkg
    type: string

steps:
- script: |
    set -e
    sudo apt-get update
    sudo apt-get install -y gcc g++ gperf bison flex texinfo help2man make libncurses5-dev \
    python3-dev autoconf automake libtool libtool-bin gawk wget bzip2 xz-utils unzip \
    patch rsync meson ninja-build pkg-config curl
  displayName: 'Prepare dependencies'
- script: |
    set -e
    # https results in a connection error, so we have to use http
    wget http://crosstool-ng.org/download/crosstool-ng/crosstool-ng-1.26.0.tar.bz2
    tar -xjf crosstool-ng-1.26.0.tar.bz2
    cd crosstool-ng-1.26.0
    ./configure --prefix=`pwd`/out
    make
    make install
  displayName: 'Setup crosstool-ng'
- script: |
    set -e
    export PATH=$PATH:`pwd`/crosstool-ng-1.26.0/out/bin
    mkdir toolchain-dir
    cd toolchain-dir
    cat ../${{ parameters.config }} > .config
    ct-ng build
  displayName: 'Build toolchain'
- script: |
    set -e
    chmod 0755 -R `pwd`/toolchain-dir/${{ parameters.tuple }}
    ./sysroot-scripts/sysroot-creator.sh build ${{ parameters.arch }} \
    `pwd`/toolchain-dir/${{ parameters.tuple }}/${{ parameters.tuple }}/sysroot
  displayName: 'Install additional libraries'
- script: |
    set -e
    sysroot=`pwd`/toolchain-dir/${{ parameters.tuple }}/${{ parameters.tuple }}/sysroot
    gio_pc=`find "$sysroot/usr/lib" -path '*/pkgconfig/gio-2.0.pc' -print -quit`
    test -n "$gio_pc"
    PKG_CONFIG_SYSROOT_DIR="$sysroot" \
    PKG_CONFIG_LIBDIR="`dirname "$gio_pc"`:$sysroot/usr/lib/pkgconfig:$sysroot/usr/share/pkgconfig" \
      pkg-config --cflags --libs gio-2.0
  displayName: 'Validate GIO pkg-config metadata'
- script: |
    set -e
    cd toolchain-dir
    tar -czf ${{ parameters.pkg }}.tar.gz ${{ parameters.tuple }}
    cp ${{ parameters.pkg }}.tar.gz $(Build.ArtifactStagingDirectory)/
  displayName: 'Create and stage pipeline asset'
