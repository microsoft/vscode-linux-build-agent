parameters:
  - name: name
    type: string
  - name: arch
    type: string
    default: amd64
  - name: qemu
    type: string
    default: 'false'
  - name: release
    type: boolean
    default: false

steps:
  - task: AzureCLI@2
    displayName: "Log in to container registry"
    inputs:
      azureSubscription: vscode
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        az acr login --name vscodehub

  - ${{ if eq(parameters.qemu, 'true') }}:
      - script: |
          set -euo pipefail
          jq --version
          BINFMT_IMAGE=vscodehub.azurecr.io/cache/docker/tonistiigi/binfmt:qemu-v10.2.3-68
          docker run --rm --privileged --platform linux/amd64 "$BINFMT_IMAGE" --uninstall 'qemu-*' |
            jq -e 'if any(.emulators[]?; startswith("qemu-")) then error("Failed to remove existing QEMU handlers") else . end'
          docker run --rm --privileged --platform linux/amd64 "$BINFMT_IMAGE" --install arm64,arm |
            jq -e 'if (.supported | index("linux/arm64") != null and index("linux/arm/v7") != null) then . else error("ARM64/ARM emulation is unavailable") end'
        displayName: "Register Docker QEMU"

  - script: |
      docker buildx build \
        --platform "linux/${{ parameters.arch }}" \
        --tag "vscodehub.azurecr.io/vscode-linux-build-agent/sanity-tests:${{ parameters.name }}-${{ parameters.arch }}" \
        --file "sanity-tests/${{ parameters.name }}/Dockerfile" \
        --network host \
        --load \
        "sanity-tests/${{ parameters.name }}"
    displayName: Build Container Image

  - ${{ if and(ne(parameters.name, 'alpine'), ne(parameters.arch, 'arm')) }}:
      - script: |
          docker run --rm --pull=never --network none \
            --platform "linux/${{ parameters.arch }}" \
            --env "QEMU=${{ parameters.qemu }}" \
            --entrypoint sh \
            "vscodehub.azurecr.io/vscode-linux-build-agent/sanity-tests:${{ parameters.name }}-${{ parameters.arch }}" \
            -ec '
              for command in sudo useradd runuser; do
                command -v "$command"
              done
              useradd --create-home sanity
              printf "sanity ALL=(root) NOPASSWD: /usr/bin/dpkg, /usr/bin/rpm\n" > /etc/sudoers.d/sanity
              chmod 440 /etc/sudoers.d/sanity
              visudo -cf /etc/sudoers.d/sanity
              test -u /usr/bin/sudo
              test "$(stat -c %u /usr/bin/sudo)" -eq 0
              if command -v dpkg > /dev/null 2>&1; then
                package_manager=/usr/bin/dpkg
              else
                package_manager=/usr/bin/rpm
              fi
              sudo -n -l -U sanity "$package_manager" --version
              if [ "$QEMU" = "true" ]; then
                # QEMU user-mode execution cannot reliably preserve setuid transitions.
                echo "Verified prerequisites and sudo policy; skipping privilege transitions under QEMU"
              else
                test "$(runuser -u sanity -- id -u)" -ne 0
                runuser -u sanity -- sudo -n "$package_manager" --version
              fi
            '
        displayName: Verify offline test prerequisites

  - task: AzureCLI@2
    displayName: Push Container Image
    inputs:
      azureSubscription: vscode
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        az acr login --name vscodehub
        docker push vscodehub.azurecr.io/vscode-linux-build-agent/sanity-tests:${{ parameters.name }}-${{ parameters.arch }}
    condition: and(succeeded(), eq(${{ parameters.release }}, true))
