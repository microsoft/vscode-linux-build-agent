steps:
- task: AzureCLI@2
  displayName: 'Log in to container registry'
  inputs:
    azureSubscription: vscode
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name vscodehub
- ${{ if eq(parameters.qemu, 'true') }}:
  - script: |
      docker run --rm --privileged --platform linux/amd64 vscodehub.azurecr.io/cache/mcr/mirror/docker/multiarch/qemu-user-static:7.2.0-1 --reset -p yes
    displayName: 'Register Docker QEMU'
- task: 1ES.BuildContainerImage@1
  inputs:
    image: vscodehub.azurecr.io/vscode-linux-build-agent:${{ parameters.arch }}
    path: ${{ parameters.arch }}
    dockerfile: ${{ parameters.arch }}/Dockerfile
    enableNetwork: true
- task: AzureCLI@2
  displayName: Azure CLI
  inputs:
    azureSubscription: vscode
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name vscodehub
      docker push vscodehub.azurecr.io/vscode-linux-build-agent:${{ parameters.arch }}
  condition: and(succeeded(), eq(${{ parameters.release }}, true))
