steps:
  - script: |
      set -e
      docker pull --platform linux/amd64 mcr.microsoft.com/mirror/docker/multiarch/qemu-user-static:7.2.0-1
      docker tag mcr.microsoft.com/mirror/docker/multiarch/qemu-user-static:7.2.0-1 vscodehub.azurecr.io/multiarch/qemu-user-static:latest
    displayName: Pull QEMU from MCR and tag for ACR
  - task: AzureCLI@2
    displayName: Push multiarch/qemu-user-static to ACR
    inputs:
      azureSubscription: vscode
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        az acr login --name vscodehub
        docker push vscodehub.azurecr.io/multiarch/qemu-user-static:latest
